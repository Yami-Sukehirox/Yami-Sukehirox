<svg width="1200" height="320" viewBox="0 0 1200 320"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d85d6b"/>
      <stop offset="45%" stop-color="#f08061"/>
      <stop offset="75%" stop-color="#f8aa67"/>
      <stop offset="100%" stop-color="#ffe09a"/>
    </linearGradient>
  </defs>

  <!-- SUNSET -->
  <rect width="1200" height="320" fill="url(#sky)"/>

  <!-- SUN -->
  <g fill="#ffe7a3">
    <rect x="525" y="105" width="150" height="100"/>
    <rect x="510" y="120" width="180" height="70"/>
    <rect x="540" y="90" width="120" height="130"/>
  </g>

  <!-- SUN GLOW -->
  <g fill="#ffd486">
    <rect x="470" y="220" width="260" height="6"/>
    <rect x="430" y="230" width="340" height="5"/>
    <rect x="390" y="240" width="420" height="4"/>
  </g>

  <!-- CLOUDS -->
  <g fill="#f7b178">
    <rect x="100" y="75" width="140" height="10"/>
    <rect x="125" y="65" width="90" height="10"/>
    <rect x="150" y="55" width="45" height="10"/>

    <rect x="900" y="75" width="150" height="10"/>
    <rect x="925" y="65" width="100" height="10"/>
    <rect x="950" y="55" width="50" height="10"/>
  </g>

  <!-- DISTANT MOUNTAINS -->
  <path d="
    M0 245 L130 175 L220 220
    L340 145 L455 225
    L590 155 L720 225
    L850 150 L1000 220
    L1120 165 L1200 205
    L1200 320 L0 320 Z"
    fill="#a65b60"/>

  <!-- MOUNTAIN LIGHT -->
  <g fill="#c87569">
    <path d="M130 175 L220 220 L180 200 L150 210Z"/>
    <path d="M340 145 L455 225 L400 185 L370 205Z"/>
    <path d="M590 155 L720 225 L660 190 L625 205Z"/>
    <path d="M850 150 L1000 220 L930 185 L890 205Z"/>
  </g>

  <!-- DESERT DUNES -->
  <path d="
    M0 250
    Q180 205 360 255
    Q540 295 720 245
    Q930 190 1200 245
    L1200 320 L0 320Z"
    fill="#d78260"/>

  <path d="
    M0 275
    Q200 235 390 280
    Q580 315 780 270
    Q980 225 1200 270
    L1200 320 L0 320Z"
    fill="#c86e5c"/>

  <!-- CACTUS LEFT -->
  <g fill="#40523e">

    <rect x="155" y="205" width="28" height="90"/>
    <rect x="150" y="220" width="38" height="65"/>

    <!-- left arm -->
    <rect x="125" y="225" width="30" height="18"/>
    <rect x="118" y="210" width="18" height="35"/>

    <!-- right arm -->
    <rect x="180" y="230" width="30" height="18"/>
    <rect x="200" y="210" width="18" height="38"/>

    <rect x="160" y="195" width="18" height="15"/>

  </g>

  <!-- CACTUS HIGHLIGHTS -->
  <g fill="#68734d">
    <rect x="160" y="215" width="6" height="60"/>
    <rect x="125" y="218" width="6" height="15"/>
    <rect x="202" y="215" width="6" height="18"/>
  </g>

  <!-- CACTUS RIGHT -->
  <g fill="#35493c">

    <rect x="1010" y="225" width="25" height="70"/>
    <rect x="1005" y="235" width="35" height="55"/>

    <rect x="980" y="245" width="30" height="16"/>
    <rect x="975" y="230" width="16" height="32"/>

    <rect x="1035" y="250" width="28" height="16"/>
    <rect x="1055" y="235" width="16" height="32"/>

    <rect x="1015" y="215" width="16" height="15"/>

  </g>

  <!-- SMALL CACTUS -->
  <g fill="#4b5b40">
    <rect x="830" y="250" width="18" height="45"/>
    <rect x="818" y="260" width="14" height="12"/>
    <rect x="812" y="250" width="10" height="25"/>
    <rect x="848" y="270" width="15" height="12"/>
    <rect x="857" y="255" width="10" height="27"/>
  </g>

  <!-- DESERT ROCKS -->
  <g fill="#805052">
    <rect x="300" y="275" width="35" height="12"/>
    <rect x="310" y="268" width="18" height="8"/>

    <rect x="900" y="280" width="40" height="10"/>
    <rect x="910" y="273" width="20" height="8"/>
  </g>

  <!-- BIRDS -->
  <g fill="#5b3b48">
    <rect x="270" y="115" width="14" height="4"/>
    <rect x="284" y="119" width="14" height="4"/>

    <rect x="800" y="125" width="12" height="4"/>
    <rect x="812" y="129" width="12" height="4"/>
  </g>

  <!-- WIND / SAND -->
  <g fill="#ffe3a0">

    <!-- long wind -->
    <rect x="285" y="205" width="45" height="4">
      <animate
        attributeName="x"
        values="285;400;285"
        dur="3s"
        repeatCount="indefinite"/>
    </rect>

    <rect x="360" y="220" width="65" height="4">
      <animate
        attributeName="x"
        values="360;500;360"
        dur="4s"
        repeatCount="indefinite"/>
    </rect>

    <!-- right wind -->
    <rect x="700" y="215" width="50" height="4">
      <animate
        attributeName="x"
        values="700;820;700"
        dur="3.5s"
        repeatCount="indefinite"/>
    </rect>

    <rect x="790" y="235" width="35" height="4">
      <animate
        attributeName="x"
        values="790;900;790"
        dur="3s"
        repeatCount="indefinite"/>
    </rect>

    <!-- small sand particles -->
    <rect x="450" y="255" width="8" height="3">
      <animate
        attributeName="x"
        values="450;550;450"
        dur="2.5s"
        repeatCount="indefinite"/>
    </rect>

    <rect x="650" y="270" width="10" height="3">
      <animate
        attributeName="x"
        values="650;750;650"
        dur="3s"
        repeatCount="indefinite"/>
    </rect>

  </g>

  <!-- FOREGROUND -->
  <rect x="0" y="305" width="1200" height="15" fill="#382b3a"/>

  <!-- GRASS -->
  <g fill="#293337">
    <rect x="70" y="285" width="6" height="20"/>
    <rect x="80" y="278" width="5" height="27"/>

    <rect x="1150" y="280" width="6" height="25"/>
    <rect x="1160" y="288" width="5" height="17"/>
  </g>

</svg>
